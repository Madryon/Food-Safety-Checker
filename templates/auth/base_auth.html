<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FoodCheck Auth{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        (function() {
            var t = localStorage.getItem('foodcheck-theme') || 'dark';
            if (t === 'tech') t = 'techno';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        :root {
            --bg: #0b1117; --surface: #121c27; --surface-2: #182535; --border: rgba(255,255,255,.09);
            --text: #e8eef5; --muted: #8ea0b3; --accent: #34d399; --accent-2: #22d3ee; --on-accent: #04261b;
            --good: #34d399; --warn: #fbbf24; --bad: #f87171; --shadow: 0 12px 32px rgba(0,0,0,.35);
            --radius: 18px;
        }
        [data-theme="light"] {
            --bg: #f6f8f5; --surface: #ffffff; --surface-2: #eef3ee; --border: rgba(20,40,30,.12);
            --text: #14221b; --muted: #5c6f64; --accent: #15803d; --accent-2: #0891b2; --on-accent: #ffffff;
            --good: #15803d; --warn: #b45309; --bad: #dc2626; --shadow: 0 10px 28px rgba(20,40,30,.10);
        }
        [data-theme="techno"], [data-theme="tech"] {
            --bg: #05060d; --surface: rgba(12,16,32,.85); --surface-2: rgba(20,26,52,.92); --border: rgba(0,240,255,.28);
            --text: #e6f7ff; --muted: #7f95b8; --accent: #00f0ff; --accent-2: #ff2bd6; --on-accent: #001418;
            --good: #39ff88; --warn: #ffd23f; --bad: #ff4d6d; --shadow: 0 0 24px rgba(0,240,255,.16);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            backdrop-filter: blur(12px);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            font-size: 14px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color .2s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-submit {
            width: 100%;
            padding: 13px 18px;
            background: var(--accent);
            color: var(--on-accent);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, opacity .2s ease;
            margin-top: 8px;
        }
        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }
        .alert-danger { background: rgba(248,113,113,.15); color: #f87171; border-color: rgba(248,113,113,.3); }
        .alert-warning { background: rgba(251,191,36,.15); color: #fbbf24; border-color: rgba(251,191,36,.3); }
        .alert-success { background: rgba(52,211,153,.15); color: #34d399; border-color: rgba(52,211,153,.3); }
        .alert-info { background: rgba(34,211,238,.15); color: #22d3ee; border-color: rgba(34,211,238,.3); }
        .theme-pill-wrap {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 20px;
        }
        .theme-pill-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .theme-pill-btn.active {
            background: var(--surface-2);
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="theme-pill-wrap">
        <button class="theme-pill-btn" onclick="setTheme('light')">☀️ Light</button>
        <button class="theme-pill-btn" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="theme-pill-btn" onclick="setTheme('techno')">💎 Tech</button>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="/" class="auth-logo">🍽️ FoodCheck</a>
            <p class="auth-subtitle">{% block subtitle %}Safe & Transparent Food Intelligence{% endblock %}</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script>
        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('foodcheck-theme', t);
            updatePillActive();
        }
        function updatePillActive() {
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            document.querySelectorAll('.theme-pill-btn').forEach(function(btn) {
                var isAct = btn.textContent.toLowerCase().indexOf(cur === 'techno' ? 'tech' : cur) !== -1;
                btn.classList.toggle('active', isAct);
            });
        }
        updatePillActive();
    </script>
</body>
</html>
