services:
  - type: web
    name: foodcheck
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AIVEN_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
